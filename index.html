<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0f14">
  <title>HELIX | Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0c10;
      color: #f1f5f9;
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      background: url('assets/yellow-wallpaper.jpg') center/cover no-repeat;
      filter: blur(18px) brightness(0.45);
      transform: scale(1.1);
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .profile-card {
      background: rgba(18, 20, 28, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 36px 28px 28px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,0.12);
      margin-bottom: 18px;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 10px;
      color: #fff;
    }

    .bio {
      font-size: 0.95rem;
      font-weight: 500;
      color: #e2e8f0;
      line-height: 1.5;
      margin-bottom: 14px;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
    }

    .location {
      font-size: 0.88rem;
      color: #94a3b8;
      margin-bottom: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .socials button,
    .socials .inactive {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
